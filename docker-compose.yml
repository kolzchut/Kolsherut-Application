# Local full stack: BE + FE + retrieval against an external Elasticsearch.
# Secrets and per-machine values come from ./.env (copy .env.example); nothing sensitive lives here.
# For a local Elasticsearch replica use ES/reindex (it owns port 9200) and point ELASTIC_URL at it.
services:
  be:
    image: kolsherut_be:${BE_IMAGE_TAG:-1.0.0}
    restart: unless-stopped
    ports:
      - ${BE_PORT:-5000}:5000
    environment:
      - ORIGIN=${ORIGIN:-*}
      # Selects the ES index pair in be/src/vars.ts: development | stage | production
      - ENV=${BE_ENV:-development}
      - PORT=5000
      - ELASTIC_URL=${ELASTIC_URL}
      - ELASTIC_USERNAME=${ELASTIC_USERNAME:-elastic}
      - ELASTIC_PASS=${ELASTIC_PASS}
      - ELASTIC_RECONNECT_TIMEOUT=5
      - VERBOSE=true
      - LOG_TO_FILE=true
      - LOG_DURATION=10
      - SEARCHCARDS_FIRST_LENGTH=50
      - AUTOCOMPLETE_MIN_SCORE=5000
      - EMAIL_NOTIFIER_SENDER_EMAIL=${EMAIL_NOTIFIER_SENDER_EMAIL:-}
      - EMAIL_NOTIFIER_PASSWORD=${EMAIL_NOTIFIER_PASSWORD:-}
      - EMAIL_NOTIFIER_RECIPIENT_LIST=${EMAIL_NOTIFIER_RECIPIENT_LIST:-}
      - EMAIL_INTERVAL_HOURS=6
      - SITEMAP_MINIMUM_LAST_MODIFIED_FOR_CARDS=2026-02-01T09:00:00
    volumes:
      - ./volumes/be/logs:/app/logs

  fe:
    image: kolsherut_fe:${FE_IMAGE_TAG:-1.0.0}
    restart: unless-stopped
    ports:
      - ${FE_PORT:-5173}:4000
    # Per-file mounts so files absent on the host keep the image's copy.
    # environment.json is generated by FE/Dockerfile from the build's `environment` arg; mount it only to override.
    volumes:
      - ./volumes/fe/configs/config.json:/usr/share/nginx/html/configs/config.json
      - ./volumes/fe/configs/strings.json:/usr/share/nginx/html/configs/strings.json
      - ./volumes/fe/configs/responseColors.json:/usr/share/nginx/html/configs/responseColors.json
      - ./volumes/fe/configs/filters.json:/usr/share/nginx/html/configs/filters.json
      - ./volumes/fe/configs/homepage.json:/usr/share/nginx/html/configs/homepage.json
      - ./volumes/fe/configs/linksBelow.json:/usr/share/nginx/html/configs/linksBelow.json
      - ./volumes/fe/configs/modules.json:/usr/share/nginx/html/configs/modules.json
      - ./volumes/fe/configs/metaTags.json:/usr/share/nginx/html/configs/metaTags.json
      - ./volumes/fe/configs/jsonLd.json:/usr/share/nginx/html/configs/jsonLd.json
      - ./volumes/fe/configs/presets.json:/usr/share/nginx/html/configs/presets.json
      - ./volumes/fe/configs/environment.json:/usr/share/nginx/html/configs/environment.json
      - ./volumes/fe/configs/local.json:/usr/share/nginx/html/configs/local.json
      - ./volumes/fe/configs/development.json:/usr/share/nginx/html/configs/development.json
      - ./volumes/fe/configs/stage.json:/usr/share/nginx/html/configs/stage.json
      - ./volumes/fe/configs/production.json:/usr/share/nginx/html/configs/production.json
    depends_on:
      - be

  retrieval:
    # Self-contained image (app + bundled local embedding model); needs `git lfs pull` in retrieval/ before building.
    build: ./retrieval
    image: kolsherut_retrieval:${RETRIEVAL_IMAGE_TAG:-1.0.0}
    restart: unless-stopped
    ports:
      - ${RETRIEVAL_PORT:-8200}:8200
    # Full knob list and the provider/index pairing rules: retrieval/.env.example
    env_file:
      - path: ./retrieval/.env
        required: false
    environment:
      - ELASTIC_URL=${ELASTIC_URL}
      - ELASTIC_USERNAME=${ELASTIC_USERNAME:-elastic}
      - ELASTIC_PASS=${ELASTIC_PASS}
      # local (bundled model, 1024 dims) or gemini (API, 3072 dims) - always switch together with the index name
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-local}
      - RETRIEVAL_EMBEDDINGS_INDEX_NAME=${RETRIEVAL_EMBEDDINGS_INDEX_NAME:-srm__services_retrieval_embeddings_v3_enriched}
      - GEMINI_EMBEDDER_API_KEY=${GEMINI_EMBEDDER_API_KEY:-}
