name: tipat
description: >-
  מקור מידע זה שואב ממשרד הבריאות את רשימת תחנות טיפת חלב הפזורות בארץ, המספקות
  שירותי בריאות ומניעה לנשים הרות, תינוקות וילדים עד גיל שש ולמשפחותיהם.

  המידע העסקי כולל את מיקום כל תחנה ופרטי הקשר שלה, ואת הארגון (קופת חולים או משרד
  הבריאות) המפעיל אותה. בנוסף, המאגר מתעד את המוקד הטלפוני הארצי של טיפת חלב, המעניק
  ייעוץ בנושאי חיסונים, הנקה, תזונה והתפתחות הילד.

apis:
  - name: fetch
    url: "https://tipatchalavlocater.health.gov.il/api/TipotChalav/GetAllTipotChalavResult"
    format: json

lookups:
  organization_ids:
    הסהר האדום: '580205615'
    משרד הבריאות: '500100904'
    שירותי בריאות כללית: srm0012
    מכבי שירותי בריאות: srm0011
    קופת חולים מאוחדת: srm0013
    קופת חולים לאומית: srm0010
    עיריית ירושלים: '500230008'
    עיריית תל אביב יפו: '500250006'

static_data:
  services:
    - id: tipat-halav-1
      name: טיפת חלב
      description: 'טיפת חלב היא תחנה המספקת שירותי בריאות ורפואה בתחום קידום בריאות ומניעה לנשים הרות, תינוקות וילדים (גילאי לידה עד 6 שנים) ומשפחותיהם. תחנות טיפת חלב פזורות בכל רחבי הארץ ומופעלות על-ידי לשכות הבריאות. טיפת חלב היא  השירות הראשון שפוגשות משפחות צעירות, אשר מלווה אותן, במקצועיות, במגוון נושאים, החל משלב ההיריון, ההכנה ללידה וההורות'
      payment_required: 'no'
      phone_numbers: null
      urls: null
      data_sources: 'המידע התקבל מ<a target="_blank" href="https://healthinstitutions.health.gov.il/TipotChalav" target="_blank">אתר משרד הבריאות</a>'
      responses: &tipat_base_responses
        - human_services:place:health:clinic:well_baby_clinic
        - human_services:health:prevent_treat:vaccinations
        - human_services:care:support_group:parenting_education
        - human_services:food:nutrition_education
        - human_services:health:prevent_treat:checkup_test:disease_screening
      situations: &tipat_base_situations
        - human_situations:household:families:fathers
        - human_situations:household:families:mothers
        - human_situations:household:families:parents
        - human_situations:age_group:infants
    - id: tipat-halav-2
      name: טיפת חלב - מוקד טלפוני
      description: "מוקד טיפת חלב בטלפון מאויש על ידי אחיות טיפת חלב, יועצות הנקה, יועצות שינה ותזונאיות מומחיות לגיל הרך.\n\nהייעוץ ניתן להורים לילדים מגיל לידה עד גיל 6, ללא קשר לטיפת החלב שבה מטופל הילד או הילדה, בנוסף לשירות הניתן בטיפות חלב בשעות הפעילות הרגילות. משפחות המקבלות טיפול בטיפות חלב של משרד הבריאות יקבלו במוקד הטלפוני מענה המבוסס על המידע הקליני המצוי ברשומה הרפואית שלהן, לאחר הזדהות. ההמלצות האישיות יתועדו כדי לשמור על הרצף הטיפולי בטיפת החלב אליה שייכים הפונים. משפחות המקבלות טיפול בטיפות חלב של קופות החולים מכבי, כללית, מאוחדת ולאומית יקבלו במוקד הטלפוני מענה המבוסס על המלצות והנחיות משרד הבריאות.\n\nבין הנושאים שבתחום אחריות טיפות החלב ושניתן לקבל בהם ייעוץ מהמוקד: תופעות לוואי לאחר חיסונים, התפתחות, הנקה, תזונה, בכי, בעיות בשינה."
      payment_required: 'no'
      urls: "https://healthinstitutions.health.gov.il/TipotChalav"
      phone_numbers: '*5400'
      data_sources: 'המידע התקבל מ<a target="_blank" href="https://healthinstitutions.health.gov.il/TipotChalav" target="_blank">אתר משרד הבריאות</a>'
      responses:
        - human_services:place:health:clinic:well_baby_clinic
        - human_services:health:prevent_treat:vaccinations
        - human_services:care:support_group:parenting_education
        - human_services:food:nutrition_education
        - human_services:health:prevent_treat:checkup_test:disease_screening
        - human_services:care:help_hotline
      situations: *tipat_base_situations
  # The national hotline branch is not part of the fetched clinics list —
  # it is always loaded with these fixed values.
  national_branch:
    - id: 'tipat-halav:national'
      name: טיפת חלב - מוקד טלפוני
      organization: ['500100904']
      services: [tipat-halav-2]
      description: null
      address_details: null
      phone_numbers: null
      email_address: null
      address: שירות ארצי
      location: שירות ארצי
      urls: null

outputs:
  - name: branch
    derive_from: fetch
    table: Branches
    base: AIRTABLE_DATA_IMPORT_BASE
    source_id: tipat-halav
    # Legacy parity: the old flow deactivated stations missing from the feed. The national row
    # lives in the next output, so it is flipped INACTIVE here and re-activated right after.
    manage_status: true
    row_transforms:
      - op: filter_rows
        predicate: equals
        field: status
        value: פעיל
    columns:
      - target: id
        source: [code]
        transforms:
          - {op: template, template: 'tipat-halav:{code}'}
      - {target: name, source: stationName}
      - target: organization
        source: ownerShip
        transforms:
          - {op: lookup_map, lookup: organization_ids}
          - {op: wrap_in_list}
      - {target: services, value: [tipat-halav-1]}
      - {target: description, source: remarks}
      - {target: address_details, source: addressComments}
      - {target: phone_numbers, source: phone1}
      - {target: email_address, source: email}
      - target: address
        source: [streetName, buildingNum, cityName, district]
        transforms:
          - op: address_cascade
            fields: {street: streetName, number: buildingNum, city: cityName, fallback: district}
            cases:
              - {require: [city, street, number], format: '{street} {number}, {city}'}
              - {require: [city, street], format: '{street}, {city}'}
              - {require: [city], format: '{city}'}
              - {require: [], format: '{fallback}'}
      - target: location
        source: [yCordinate, xCordinate, address]
        transforms:
          - {op: pluscode_location, lat_field: yCordinate, lon_field: xCordinate, fallback_field: address}
      - target: urls
        source: [code]
        transforms:
          - {op: template, template: 'https://tipatchalavappointments.health.gov.il/patient-details?codeStation={code}'}

  - name: national_branch
    derive_from: static_data.national_branch
    table: Branches
    base: AIRTABLE_DATA_IMPORT_BASE
    source_id: tipat-halav
    columns:
      - {target: id, source: id}
      - {target: name, source: name}
      - {target: organization, source: organization}
      - {target: services, source: services}
      - {target: description, source: description}
      - {target: address_details, source: address_details}
      - {target: phone_numbers, source: phone_numbers}
      - {target: email_address, source: email_address}
      - {target: address, source: address}
      - {target: location, source: location}
      - {target: urls, source: urls}

  - name: service
    derive_from: static_data.services
    table: Services
    base: AIRTABLE_DATA_IMPORT_BASE
    source_id: tipat-halav
    manage_status: true
    columns:
      - {target: id, source: id}
      - {target: name, source: name}
      - {target: description, source: description}
      - {target: payment_required, source: payment_required}
      - {target: phone_numbers, source: phone_numbers}
      - {target: urls, source: urls}
      - {target: data_sources, source: data_sources}
      - {target: responses, source: responses}
      - {target: situations, source: situations}
