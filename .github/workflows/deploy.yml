name: Deploy

# Single orchestrator for all services. Builds changed services in parallel,
# then deploys them in ONE job so the non-prod cluster is started and stopped
# exactly once per run — parallel per-service workflows used to race: the
# first one to finish stopped the cluster under the others' deploys.
on:
  push:
    branches: ['main', 'dev', 'production']
    paths:
      - 'FE/**'
      - 'be/**'
      - 'ETL/**'
      - 'retrieval/**'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/reusable-build-image.yml'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      scope:
        description: 'all = every service (a dispatch does not diff) | fe = FE + production SSG only'
        type: choice
        options: [all, fe]
        default: all

# One group per ref so runs serialize their cluster start/stop window.
# cancel-in-progress must stay false: a cancelled run's async `az aks stop
# --no-wait` could shut the cluster down under the replacement run's deploy.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      fe: ${{ steps.compute.outputs.fe }}
      be: ${{ steps.compute.outputs.be }}
      etl: ${{ steps.compute.outputs.etl }}
      etl_plugins: ${{ steps.compute.outputs.etl_plugins }}
      retrieval: ${{ steps.compute.outputs.retrieval }}
      version: ${{ steps.compute.outputs.version }}
      fe_env: ${{ steps.compute.outputs.fe_env }}
      env_tag: ${{ steps.compute.outputs.env_tag }}
      is_nonprod: ${{ steps.compute.outputs.is_nonprod }}
      is_prod: ${{ steps.compute.outputs.is_prod }}
      nonprod_ssg: ${{ steps.compute.outputs.nonprod_ssg }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Changed Services
        id: filter
        if: github.event_name == 'push'
        uses: dorny/paths-filter@v3
        with:
          # Compare against the commit before this push. Without this, the
          # action diffs against the repo default branch (main), which on dev
          # marks every service as changed.
          base: ${{ github.ref }}
          filters: |
            fe:
              - 'FE/**'
            be:
              - 'be/**'
            # The ETL has two independent routes, so it needs three filters.
            # Negation ('!ETL/data/plugins/**') is deliberately NOT used: a
            # filter's patterns are OR-combined, so a '!' pattern matches every
            # path outside its directory and the exclusion becomes a no-op.
            etl:
              - 'ETL/**'
            etl_image:
              - 'ETL/dockerfile'
              - 'ETL/requirements.txt'
              - 'ETL/data/config.json'
            etl_plugins:
              - 'ETL/data/plugins/srm-etl/operators/**'
              - 'ETL/data/plugins/srm-etl/engine/**'
              - 'ETL/data/plugins/srm-etl/specs/**'
              - 'ETL/data/plugins/srm-etl/transformers/**'
              - 'ETL/data/plugins/srm-etl/srm_tools/**'
              - 'ETL/data/plugins/srm-etl/utilities/**'
              - 'ETL/data/plugins/srm-etl/transform/**'
              - 'ETL/data/plugins/srm-etl/extract/**'
              - 'ETL/data/plugins/srm-etl/load/**'
              - 'ETL/data/plugins/srm-etl/conf/**'
            retrieval:
              - 'retrieval/**'
            workflows:
              - '.github/workflows/deploy.yml'
              - '.github/workflows/reusable-build-image.yml'

      - name: Compute Outputs
        id: compute
        env:
          # Repository secret. Only the literal string "true" enables the
          # dev/stage SSG phase; unset or anything else skips it (the base
          # image still deploys). The `secrets` context is unavailable in job
          # `if:` conditions, so it is resolved here once into an output.
          NONPROD_SSG_ENABLED: ${{ secrets.NONPROD_SSG_ENABLED }}
        run: |
          REF="${{ github.ref }}"
          EVENT="${{ github.event_name }}"

          DEPLOY_ALL=false
          if [[ "$EVENT" == "release" || "$EVENT" == "workflow_dispatch" ]]; then
            DEPLOY_ALL=true
          fi
          if [[ "$REF" == refs/tags/v* ]]; then
            DEPLOY_ALL=true
          fi
          if [[ "${{ steps.filter.outputs.workflows }}" == "true" ]]; then
            DEPLOY_ALL=true
          fi

          # A dispatch scoped to "fe" rebuilds and redeploys the FE alone - on a
          # release tag that is the production SSG refresh. Only a dispatch can
          # ask for it; pushes and releases are unaffected.
          FE_ONLY=false
          if [[ "$EVENT" == "workflow_dispatch" && "${{ inputs.scope }}" == "fe" ]]; then
            FE_ONLY=true
          fi

          for SVC in fe be retrieval; do
            case "$SVC" in
              fe)        CHANGED="${{ steps.filter.outputs.fe }}" ;;
              be)        CHANGED="${{ steps.filter.outputs.be }}" ;;
              retrieval) CHANGED="${{ steps.filter.outputs.retrieval }}" ;;
            esac
            if [[ "$FE_ONLY" == "true" ]]; then
              if [[ "$SVC" == "fe" ]]; then
                echo "$SVC=true" >> "$GITHUB_OUTPUT"
              else
                echo "$SVC=false" >> "$GITHUB_OUTPUT"
              fi
            elif [[ "$DEPLOY_ALL" == "true" || "$CHANGED" == "true" ]]; then
              echo "$SVC=true" >> "$GITHUB_OUTPUT"
            else
              echo "$SVC=false" >> "$GITHUB_OUTPUT"
            fi
          done

          # ETL is not in the loop above because it has two independent routes.
          # `etl` is the image route (build + rollout, as every other service).
          # `etl_plugins` syncs the plugin tree to its Azure File Share and
          # touches no cluster at all. A plugin-only push must therefore leave
          # `etl` false - that is precisely what keeps the dev/stage cluster from
          # being started for a one-line operator change.
          ETL_ANY="${{ steps.filter.outputs.etl }}"
          ETL_IMAGE="${{ steps.filter.outputs.etl_image }}"
          ETL_PLUGINS="${{ steps.filter.outputs.etl_plugins }}"

          ETL=false
          if [[ "$ETL_IMAGE" == "true" ]]; then
            ETL=true
          elif [[ "$ETL_ANY" == "true" && "$ETL_PLUGINS" != "true" ]]; then
            # An ETL change that is neither an image input nor a plugin file -
            # docs, tests, docker-compose.yml. Rebuild, exactly as before the
            # split, rather than silently deploying nothing.
            ETL=true
          fi

          if [[ "$FE_ONLY" == "true" ]]; then
            ETL=false
            ETL_PLUGINS=false
          elif [[ "$DEPLOY_ALL" == "true" ]]; then
            ETL=true
            ETL_PLUGINS=true
          fi

          # The filter step is skipped for release/dispatch, leaving the outputs
          # empty rather than "false".
          [[ "$ETL_PLUGINS" == "true" ]] || ETL_PLUGINS=false

          echo "etl=$ETL" >> "$GITHUB_OUTPUT"
          echo "etl_plugins=$ETL_PLUGINS" >> "$GITHUB_OUTPUT"
          echo "ETL routes: image=$ETL plugins=$ETL_PLUGINS"

          if [[ "$REF" == refs/tags/v* ]]; then
            echo "version=${REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
            echo "fe_env=production" >> "$GITHUB_OUTPUT"
          elif [[ "$REF" == "refs/heads/production" ]]; then
            echo "version=production" >> "$GITHUB_OUTPUT"
            echo "fe_env=production" >> "$GITHUB_OUTPUT"
          elif [[ "$REF" == "refs/heads/main" ]]; then
            echo "version=stage" >> "$GITHUB_OUTPUT"
            echo "fe_env=stage" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev" >> "$GITHUB_OUTPUT"
            echo "fe_env=development" >> "$GITHUB_OUTPUT"
          fi

          if [[ "$REF" == "refs/heads/main" ]]; then
            echo "env_tag=stage" >> "$GITHUB_OUTPUT"
          else
            echo "env_tag=dev" >> "$GITHUB_OUTPUT"
          fi

          if [[ "$REF" == "refs/heads/dev" || "$REF" == "refs/heads/main" ]]; then
            echo "is_nonprod=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_nonprod=false" >> "$GITHUB_OUTPUT"
          fi

          if [[ "$REF" == refs/tags/v* || "$REF" == "refs/heads/production" ]]; then
            echo "is_prod=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prod=false" >> "$GITHUB_OUTPUT"
          fi

          if [[ "${NONPROD_SSG_ENABLED,,}" == "true" ]]; then
            echo "nonprod_ssg=true" >> "$GITHUB_OUTPUT"
          else
            echo "nonprod_ssg=false" >> "$GITHUB_OUTPUT"
            echo "NONPROD_SSG_ENABLED is not 'true': dev/stage deploys will skip the SSG phase"
          fi

  build-be:
    needs: detect
    if: needs.detect.outputs.be == 'true'
    uses: ./.github/workflows/reusable-build-image.yml
    secrets: inherit
    with:
      service_path: 'be'
      image_name: 'kolsherut-be'
      version: ${{ needs.detect.outputs.version }}
      node_build: true

  build-etl:
    needs: detect
    if: needs.detect.outputs.etl == 'true'
    uses: ./.github/workflows/reusable-build-image.yml
    secrets: inherit
    with:
      service_path: 'ETL'
      image_name: 'kolsherut-etl'
      version: ${{ needs.detect.outputs.version }}

  build-retrieval:
    needs: detect
    if: needs.detect.outputs.retrieval == 'true'
    uses: ./.github/workflows/reusable-build-image.yml
    secrets: inherit
    with:
      service_path: 'retrieval'
      image_name: 'kolsherut-retrieval'
      version: ${{ needs.detect.outputs.version }}
      lfs: true

  # ── ETL plugins route ──────────────────────────────────────────────────────
  # The plugin tree is pure Python/YAML/CSV/JSON - nothing compiled - and
  # Cronicle forks a fresh python3 per job, so a plugin change needs no image
  # build and no pod restart. This job talks only to the Azure File Share that
  # backs the ETL's plugin mounts, so it never starts the dev/stage cluster.
  # That start/stop window was the bulk of the old round trip for a one-line
  # operator change.
  sync-etl-plugins:
    needs: detect
    if: needs.detect.outputs.etl_plugins == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SHARE_NAME: etl-plugins
      # Pinned deliberately, and NOT because the runner lacks azcopy - it ships
      # one. --compare-hash=MD5 in the sync step is the single flag this whole
      # job depends on, and its semantics have moved between azcopy releases, so
      # an unpinned "latest" could silently revert the sync to full re-uploads
      # with no diff in this repo to explain it.
      # WHEN BUMPING THIS: re-run the acceptance test - push a one-line plugin
      # change and confirm the sync reports a small "Number of File Transfers",
      # not the whole ~225-file tree.
      AZCOPY_VERSION: "10.32.8"
      AZCOPY_BIN: /usr/local/bin/azcopy
      # Must stay in step with etl.pluginsShare.mountedDirectories in
      # Infra/values.yaml and the COPY lines in ETL/dockerfile.
      PLUGIN_DIRECTORIES: "operators engine specs transformers srm_tools utilities transform extract load conf"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set Share Variables
        run: |
          if [[ "${{ needs.detect.outputs.is_prod }}" == "true" ]]; then
            echo "STORAGE_ACCOUNT=${{ secrets.PROD_ETL_PLUGINS_STORAGE_ACCOUNT }}" >> $GITHUB_ENV
            echo "STORAGE_KEY=${{ secrets.PROD_ETL_PLUGINS_STORAGE_KEY }}" >> $GITHUB_ENV
          elif [[ "${{ needs.detect.outputs.env_tag }}" == "stage" ]]; then
            echo "STORAGE_ACCOUNT=${{ secrets.STAGE_ETL_PLUGINS_STORAGE_ACCOUNT }}" >> $GITHUB_ENV
            echo "STORAGE_KEY=${{ secrets.STAGE_ETL_PLUGINS_STORAGE_KEY }}" >> $GITHUB_ENV
          else
            echo "STORAGE_ACCOUNT=${{ secrets.DEV_ETL_PLUGINS_STORAGE_ACCOUNT }}" >> $GITHUB_ENV
            echo "STORAGE_KEY=${{ secrets.DEV_ETL_PLUGINS_STORAGE_KEY }}" >> $GITHUB_ENV
          fi

      - name: Stage Plugin Tree
        run: |
          PLUGIN_SOURCE=ETL/data/plugins/srm-etl
          STAGED="$RUNNER_TEMP/etl-plugins"
          rm -rf "$STAGED"
          for directory in $PLUGIN_DIRECTORIES; do
            mkdir -p "$STAGED/$directory"
            cp -r "$PLUGIN_SOURCE/$directory/." "$STAGED/$directory/"
          done
          # Bytecode must never reach the share: the plugin directories are
          # mounted readOnly, and PYTHONPYCACHEPREFIX keeps the pod's own cache
          # in /tmp. A clean CI checkout has none of this; the prune is what
          # makes the step safe to run from a working tree too.
          find "$STAGED" -name '__pycache__' -type d -prune -exec rm -rf {} +
          find "$STAGED" -name '*.pyc' -delete
          echo "${{ github.sha }}" > "$STAGED/VERSION"
          echo "STAGED=$STAGED" >> $GITHUB_ENV

      - name: Verify Staged Tree
        run: |
          if [[ -z "$STORAGE_ACCOUNT" ]]; then
            echo "No ETL plugins storage account configured for this environment."
            echo "Set the <DEV|STAGE|PROD>_ETL_PLUGINS_STORAGE_ACCOUNT and _KEY"
            echo "repository secrets, and create the '$SHARE_NAME' share, before"
            echo "merging a plugin change. See Infra/DEPLOYMENT.md."
            exit 1
          fi
          FILE_COUNT=$(find "$STAGED" -type f | wc -l)
          echo "staged $FILE_COUNT files for $STORAGE_ACCOUNT/$SHARE_NAME"
          # The sync below runs with --delete-destination=true, so an empty or
          # truncated staging directory is the one way this job could clear the
          # share out from under a running pod. 200 sits well under the ~225
          # tracked files and well above anything a partial checkout would give.
          if [[ "$FILE_COUNT" -lt 200 ]]; then
            echo "refusing to sync: only $FILE_COUNT files staged"
            exit 1
          fi
          test -s "$STAGED/engine/__main__.py"
          test -s "$STAGED/conf/settings.py"
          # --delete-destination=true is only safe because every mounted
          # directory is present in the staged tree and therefore never
          # extraneous. Assert that here rather than leaving it to rest on
          # `cp` failing under `set -e` in the previous step.
          for directory in $PLUGIN_DIRECTORIES; do
            if [[ ! -d "$STAGED/$directory" ]]; then
              echo "refusing to sync: staged tree is missing $directory/"
              exit 1
            fi
          done

      - name: Install azcopy
        run: |
          set -o pipefail
          # -f so a bad version tag fails here instead of writing an HTML error
          # page into the tarball.
          AZCOPY_URL="https://github.com/Azure/azure-storage-azcopy/releases/download/v$AZCOPY_VERSION/azcopy_linux_amd64_$AZCOPY_VERSION.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/azcopy.tar.gz" "$AZCOPY_URL"
          tar -xzf "$RUNNER_TEMP/azcopy.tar.gz" -C "$RUNNER_TEMP" --strip-components=1 --wildcards '*/azcopy'
          sudo install -m 0755 "$RUNNER_TEMP/azcopy" "$AZCOPY_BIN"
          # By absolute path: the runner's own azcopy is also on PATH.
          "$AZCOPY_BIN" --version

      - name: Sync Plugins To Share
        id: sync
        run: |
          set -o pipefail
          # A short-lived, share-scoped SAS rather than the account key: the
          # long-lived key never leaves this job, and the credential that can
          # write to the share expires in 30 minutes.
          EXPIRY=$(date -u -d '30 minutes' '+%Y-%m-%dT%H:%MZ')
          SAS=$(az storage share generate-sas --name "$SHARE_NAME" --account-name "$STORAGE_ACCOUNT" --account-key "$STORAGE_KEY" --permissions rwdlc --expiry "$EXPIRY" --https-only -o tsv)
          echo "::add-mask::$SAS"
          DESTINATION="https://$STORAGE_ACCOUNT.file.core.windows.net/$SHARE_NAME?$SAS"

          # --compare-hash=MD5 is load-bearing. azcopy's default comparison is
          # last-modified-time, and actions/checkout stamps every file with the
          # checkout time - always newer than the share - so the default would
          # re-upload the whole tree on every run and defeat the point of this
          # job. --put-md5 stores the hash so the NEXT run can compare.
          # Never add --preserve-smb-info: .pyc invalidation keys on source
          # mtime+size, and fresh checkout mtimes are what keeps stale bytecode
          # impossible.
          # --delete-destination removes files deleted from the repo, which is
          # what stops renamed modules lingering on the share as zombie imports.
          # It can only ever delete NESTED paths: all ten mounted directories are
          # always present in the staged tree, so they are never extraneous.
          # Never run `azcopy remove --recursive` or `az storage directory delete
          # --recursive` on this share - removing a directory behind a subPath
          # bind mount leaves the running pod with a stale view until it restarts.
          SYNC_FLAGS="--recursive --delete-destination=true --compare-hash=MD5 --put-md5"
          "$AZCOPY_BIN" sync "$STAGED" "$DESTINATION" $SYNC_FLAGS 2>&1 | tee /tmp/azcopy.log

      - name: Report Sync Summary
        if: always() && steps.sync.outcome != 'skipped'
        run: |
          {
            echo "### ETL plugins sync"
            echo ""
            echo "Share: $SHARE_NAME on $STORAGE_ACCOUNT, commit ${{ github.sha }}"
            echo ""
            echo '```'
            sed -n '/[Ss]ummary/,$p' /tmp/azcopy.log || echo "no azcopy log produced"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  build-fe:
    needs: detect
    if: needs.detect.outputs.fe == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.ACR_LOGIN_SERVER }}/kolsherut-fe
          tags: |
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=raw,value=stage,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=production,enable=${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/production' }}

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'FE/package-lock.json'

      - name: Install and Build Base (No SSG)
        run: |
          cd FE
          npm install
          npm run build:${{ needs.detect.outputs.fe_env }}:base

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and Push Base Image
        uses: docker/build-push-action@v5
        with:
          context: ./FE
          file: ./FE/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            environment=${{ needs.detect.outputs.fe_env }}
          # The AKS node pools are ARM, so amd64 is dead weight in both build
          # time and ACR storage.
          platforms: linux/arm64
          provenance: false

      # Non-prod SSG runs in deploy-nonprod (it crawls against the backend on
      # the cluster, which is only up during the deploy window) and re-images
      # from this exact dist. Skipped entirely when the NONPROD_SSG_ENABLED
      # secret is not "true" (see the detect job).
      - name: Upload dist For SSG Phase
        if: needs.detect.outputs.is_nonprod == 'true' && needs.detect.outputs.nonprod_ssg == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fe-dist
          path: FE/dist
          retention-days: 1

      # Prod SSG stays here: the production backend is always up.
      - name: Build SSG (Production)
        if: needs.detect.outputs.is_prod == 'true'
        env:
          SSG_USER_AGENT: ${{ secrets.SSG_USER_AGENT }}
        run: |
          cd FE
          npm run build:${{ needs.detect.outputs.fe_env }}:ssg

      - name: Build and Push Image with SSG (Production)
        if: needs.detect.outputs.is_prod == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./FE
          file: ./FE/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            environment=${{ needs.detect.outputs.fe_env }}
          platforms: linux/arm64
          provenance: false

  deploy-nonprod:
    needs: [detect, build-fe, build-be, build-etl, build-retrieval, sync-etl-plugins]
    # !cancelled(): run even when some builds were skipped or failed (but not
    # when the run was cancelled) — each deploy
    # step below checks its own build's result, so one broken service never
    # blocks the others or the cluster stop.
    if: >
      !cancelled() &&
      needs.detect.result == 'success' &&
      needs.detect.outputs.is_nonprod == 'true' &&
      (needs.build-fe.result == 'success' ||
       needs.build-be.result == 'success' ||
       needs.build-etl.result == 'success' ||
       needs.build-retrieval.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Per-service deploy outcomes for the report-status badge job. When the
    # SSG phase is disabled (NONPROD_SSG_ENABLED != "true") the FE outcome is
    # the base deploy, since the SSG deploy step never runs.
    outputs:
      fe: ${{ needs.detect.outputs.nonprod_ssg == 'true' && steps.deploy_fe_ssg.outcome || steps.deploy_fe_base.outcome }}
      be: ${{ steps.deploy_be.outcome }}
      etl: ${{ steps.deploy_etl.outcome }}
      retrieval: ${{ steps.deploy_retrieval.outcome }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set Cluster Variables
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/dev" ]]; then
            echo "CLUSTER_NAME=${{ secrets.DEV_CLUSTER_NAME }}" >> $GITHUB_ENV
            echo "CLUSTER_RG=${{ secrets.DEV_RESOURCE_GROUP }}" >> $GITHUB_ENV
          else
            echo "CLUSTER_NAME=${{ secrets.STAGE_CLUSTER_NAME }}" >> $GITHUB_ENV
            echo "CLUSTER_RG=${{ secrets.STAGE_RESOURCE_GROUP }}" >> $GITHUB_ENV
          fi
          echo "ENV_TAG=${{ needs.detect.outputs.env_tag }}" >> $GITHUB_ENV

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Waits out transitional states (e.g. a previous run's `az aks stop
      # --no-wait` still settling) instead of racing them.
      - name: Ensure Cluster Running
        id: start_cluster
        timeout-minutes: 20
        run: |
          WAS_STOPPED=false
          for i in $(seq 1 40); do
            POWER=$(az aks show --resource-group "$CLUSTER_RG" --name "$CLUSTER_NAME" --query powerState.code -o tsv)
            PROV=$(az aks show --resource-group "$CLUSTER_RG" --name "$CLUSTER_NAME" --query provisioningState -o tsv)
            echo "powerState=$POWER provisioningState=$PROV"
            if [[ "$PROV" == "Stopping" || "$PROV" == "Starting" ]]; then
              sleep 30
            elif [[ "$POWER" == "Stopped" ]]; then
              echo "CLUSTER_WAS_STOPPED=true" >> "$GITHUB_ENV"
              WAS_STOPPED=true
              az aks start --resource-group "$CLUSTER_RG" --name "$CLUSTER_NAME"
            elif [[ "$POWER" == "Running" ]]; then
              echo "CLUSTER_WAS_STOPPED=$WAS_STOPPED" >> "$GITHUB_ENV"
              exit 0
            else
              sleep 30
            fi
          done
          echo "Cluster never reached Running state"
          exit 1

      - name: Set up kubelogin
        uses: azure/use-kubelogin@v1
        with:
          version: 'v0.0.24'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set AKS Context
        id: ctx
        uses: azure/aks-set-context@v3
        with:
          resource-group: ${{ env.CLUSTER_RG }}
          cluster-name: ${{ env.CLUSTER_NAME }}
          use-kubelogin: 'true'

      # BE deploys first so the FE SSG crawl below hits the fresh backend.
      # 2m was not enough for be/etl when the cluster was just started for this
      # deploy: the nodes are cold, so the image pull alone can outlast it.
      - name: Deploy BE
        id: deploy_be
        if: ${{ !cancelled() && steps.ctx.outcome == 'success' && needs.build-be.result == 'success' }}
        timeout-minutes: 12
        run: |
          kubectl rollout restart deployment/kolsherut-be -n default
          kubectl rollout status deployment/kolsherut-be -n default --timeout=10m

      # The needs: edge already orders the plugins sync ahead of this, but a
      # FAILED sync must not be rolled onto: the share would be half updated.
      - name: Deploy ETL
        id: deploy_etl
        if: ${{ !cancelled() && steps.ctx.outcome == 'success' && needs.build-etl.result == 'success' && needs.sync-etl-plugins.result != 'failure' }}
        timeout-minutes: 12
        run: |
          kubectl rollout restart deployment/kolsherut-etl -n default
          kubectl rollout status deployment/kolsherut-etl -n default --timeout=10m

      # Retrieval warms the embedding model before it reports Ready, so give
      # the rollout longer than the other services.
      - name: Deploy Retrieval
        id: deploy_retrieval
        if: ${{ !cancelled() && steps.ctx.outcome == 'success' && needs.build-retrieval.result == 'success' }}
        timeout-minutes: 15
        run: |
          kubectl rollout restart deployment/kolsherut-retrieval -n default
          kubectl rollout status deployment/kolsherut-retrieval -n default --timeout=12m

      # FE rollouts get 45m: the sync-config initContainer copies the whole
      # SSG output to Azure Files on every pod start, which can take 15-25m.
      - name: Deploy FE Base
        id: deploy_fe_base
        if: ${{ !cancelled() && steps.ctx.outcome == 'success' && needs.build-fe.result == 'success' }}
        timeout-minutes: 35
        run: |
          kubectl rollout restart deployment/kolsherut-fe -n default
          kubectl rollout status deployment/kolsherut-fe -n default --timeout=45m

      # ── FE SSG phase: crawl the deployed app while the cluster is up ──
      # Gated on the NONPROD_SSG_ENABLED repository secret (resolved in the
      # detect job): when it is not "true" the base image stays live and the
      # whole phase below is skipped, so dev/stage deploys finish in minutes.
      - name: Skip SSG Phase (NONPROD_SSG_ENABLED Is Not "true")
        if: ${{ !cancelled() && steps.deploy_fe_base.outcome == 'success' && needs.detect.outputs.nonprod_ssg != 'true' }}
        run: echo "NONPROD_SSG_ENABLED is not 'true' - the base image stays live without pre-rendered pages"

      - name: Setup Node.js (SSG)
        if: ${{ !cancelled() && steps.deploy_fe_base.outcome == 'success' && needs.detect.outputs.nonprod_ssg == 'true' }}
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'FE/package-lock.json'

      - name: Download FE dist
        if: ${{ !cancelled() && steps.deploy_fe_base.outcome == 'success' && needs.detect.outputs.nonprod_ssg == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: fe-dist
          path: FE/dist

      # The full crawl takes ~3h (measured); 330m is the effective max inside
      # the 360m job cap after the cluster start and service deploys.
      - name: Build SSG
        id: build_ssg
        if: ${{ !cancelled() && steps.deploy_fe_base.outcome == 'success' && needs.detect.outputs.nonprod_ssg == 'true' }}
        timeout-minutes: 330
        env:
          SSG_USER_AGENT: ${{ secrets.SSG_USER_AGENT }}
        run: |
          cd FE
          npm install
          npm run build:${{ needs.detect.outputs.fe_env }}:ssg

      # Everything below requires build_ssg success: a timed-out crawl must
      # never be pushed or deployed as the stage/dev image.
      - name: Set up QEMU
        if: ${{ !cancelled() && steps.build_ssg.outcome == 'success' }}
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        if: ${{ !cancelled() && steps.build_ssg.outcome == 'success' }}
        uses: docker/setup-buildx-action@v3
      - name: Log in to ACR
        if: ${{ !cancelled() && steps.build_ssg.outcome == 'success' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and Push Image with SSG
        if: ${{ !cancelled() && steps.build_ssg.outcome == 'success' }}
        uses: docker/build-push-action@v5
        with:
          context: ./FE
          file: ./FE/Dockerfile
          push: true
          tags: ${{ secrets.ACR_LOGIN_SERVER }}/kolsherut-fe:${{ env.ENV_TAG }}
          build-args: |
            environment=${{ needs.detect.outputs.fe_env }}
          platforms: linux/arm64
          provenance: false

      - name: Deploy FE with SSG
        id: deploy_fe_ssg
        if: ${{ !cancelled() && steps.build_ssg.outcome == 'success' }}
        timeout-minutes: 35
        run: |
          kubectl rollout restart deployment/kolsherut-fe -n default
          kubectl rollout status deployment/kolsherut-fe -n default --timeout=45m

      # The cluster was off before this run started it, so return it to off —
      # even when a deploy failed or the run was cancelled (always()). A
      # human-started cluster (CLUSTER_WAS_STOPPED=false) is never stopped.
      - name: Stop Cluster If Started By Workflow
        if: always() && env.CLUSTER_WAS_STOPPED == 'true'
        run: az aks stop --resource-group "$CLUSTER_RG" --name "$CLUSTER_NAME" --no-wait

      - name: Fail If Any Build Failed
        if: >
          !cancelled() &&
          (needs.build-fe.result == 'failure' ||
           needs.build-be.result == 'failure' ||
           needs.build-etl.result == 'failure' ||
           needs.build-retrieval.result == 'failure' ||
           needs.sync-etl-plugins.result == 'failure')
        run: |
          echo "At least one build or sync job failed"
          exit 1

  # Publishes per-service pass/fail + timestamp to .badges/ on the dev branch,
  # which feeds the shields.io status matrix in the root README. Services
  # skipped in this run keep their previous badge (last known status per
  # environment). Badge commits trigger nothing: .badges/ is outside this
  # workflow's paths filter and in graphify's paths-ignore. Never put
  # "[skip ci]" in these commit messages — squash-merging dev into main
  # concatenates them into the merge commit, which then skips ALL workflows
  # on main (this happened with PR #56).
  report-status:
    needs: [detect, build-fe, build-be, build-etl, build-retrieval, sync-etl-plugins, deploy-nonprod, deploy-production]
    if: >
      !cancelled() &&
      needs.detect.result == 'success' &&
      (needs.detect.outputs.is_nonprod == 'true' || needs.detect.outputs.is_prod == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Badges Location
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Update Badge Files
        env:
          IS_PROD: ${{ needs.detect.outputs.is_prod }}
          ENV_TAG: ${{ needs.detect.outputs.env_tag }}
          BUILD_FE: ${{ needs.build-fe.result }}
          BUILD_BE: ${{ needs.build-be.result }}
          BUILD_ETL: ${{ needs.build-etl.result }}
          BUILD_RETRIEVAL: ${{ needs.build-retrieval.result }}
          SYNC_ETL: ${{ needs.sync-etl-plugins.result }}
          NONPROD_FE: ${{ needs.deploy-nonprod.outputs.fe }}
          NONPROD_BE: ${{ needs.deploy-nonprod.outputs.be }}
          NONPROD_ETL: ${{ needs.deploy-nonprod.outputs.etl }}
          NONPROD_RETRIEVAL: ${{ needs.deploy-nonprod.outputs.retrieval }}
          PROD_FE: ${{ needs.deploy-production.outputs.fe }}
          PROD_BE: ${{ needs.deploy-production.outputs.be }}
          PROD_ETL: ${{ needs.deploy-production.outputs.etl }}
          PROD_RETRIEVAL: ${{ needs.deploy-production.outputs.retrieval }}
        run: |
          if [[ "$IS_PROD" == "true" ]]; then
            ENV_NAME=production
            DEPLOY_FE="$PROD_FE"; DEPLOY_BE="$PROD_BE"
            DEPLOY_ETL="$PROD_ETL"; DEPLOY_RETRIEVAL="$PROD_RETRIEVAL"
          else
            ENV_NAME="$ENV_TAG"
            DEPLOY_FE="$NONPROD_FE"; DEPLOY_BE="$NONPROD_BE"
            DEPLOY_ETL="$NONPROD_ETL"; DEPLOY_RETRIEVAL="$NONPROD_RETRIEVAL"
          fi
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')

          update_badge () {
            SVC="$1"; LABEL="$2"; BUILD="$3"; DEPLOY="$4"
            if [[ "$BUILD" == "skipped" ]]; then
              echo "$LABEL: skipped this run, badge unchanged"
              return
            fi
            if [[ "$BUILD" == "success" && "$DEPLOY" == "success" ]]; then
              STATUS=passing; COLOR=brightgreen
            else
              STATUS=failing; COLOR=red
            fi
            printf '{"schemaVersion":1,"label":"%s","message":"%s · %s","color":"%s"}\n' \
              "$LABEL" "$STATUS" "$TIMESTAMP" "$COLOR" > ".badges/${ENV_NAME}-${SVC}.json"
            echo "$LABEL ($ENV_NAME): $STATUS"
          }

          update_badge fe FE "$BUILD_FE" "$DEPLOY_FE"
          update_badge be BE "$BUILD_BE" "$DEPLOY_BE"
          update_badge etl ETL "$BUILD_ETL" "$DEPLOY_ETL"
          update_badge retrieval Retrieval "$BUILD_RETRIEVAL" "$DEPLOY_RETRIEVAL"
          # The plugins route has a single outcome - it never touches the
          # cluster, so there is no separate deploy step to report.
          update_badge etl-plugins "ETL Plugins" "$SYNC_ETL" "$SYNC_ETL"

      - name: Commit and Push Badges
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet .badges; then
            echo "No badge changes to publish"
            exit 0
          fi
          git add .badges
          git commit -m "Update deploy status badges"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:dev; then
              exit 0
            fi
            git pull --rebase origin dev
          done
          exit 1

  deploy-production:
    needs: [detect, build-fe, build-be, build-etl, build-retrieval, sync-etl-plugins]
    if: >
      !cancelled() &&
      needs.detect.result == 'success' &&
      needs.detect.outputs.is_prod == 'true' &&
      (needs.build-fe.result == 'success' ||
       needs.build-be.result == 'success' ||
       needs.build-etl.result == 'success' ||
       needs.build-retrieval.result == 'success')
    runs-on: ubuntu-latest
    # Per-service deploy outcomes for the report-status badge job.
    outputs:
      fe: ${{ steps.deploy_fe.outcome }}
      be: ${{ steps.deploy_be.outcome }}
      etl: ${{ steps.deploy_etl.outcome }}
      retrieval: ${{ steps.deploy_retrieval.outcome }}
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set up kubelogin
        uses: azure/use-kubelogin@v1
        with:
          version: 'v0.0.24'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set AKS Context (Production)
        id: ctx
        uses: azure/aks-set-context@v3
        with:
          resource-group: ${{ secrets.PROD_RESOURCE_GROUP }}
          cluster-name: ${{ secrets.PROD_CLUSTER_NAME }}
          use-kubelogin: 'true'

      - name: Deploy BE to Production
        id: deploy_be
        if: ${{ !cancelled() && steps.ctx.outcome == 'success' && needs.build-be.result == 'success' }}
        run: |
          kubectl set image deployment/kolsherut-be kolsherut-be=${{ secrets.ACR_LOGIN_SERVER }}/kolsherut-be:production -n default
          kubectl set env deployment/kolsherut-be CODE_VERSION=${{ needs.detect.outputs.version }} -n default
          kubectl rollout restart deployment/kolsherut-be -n default
          kubectl rollout status deployment/kolsherut-be -n default --timeout=3m

      - name: Deploy ETL to Production
        id: deploy_etl
        if: ${{ !cancelled() && steps.ctx.outcome == 'success' && needs.build-etl.result == 'success' && needs.sync-etl-plugins.result != 'failure' }}
        run: |
          kubectl set image deployment/kolsherut-etl etl=${{ secrets.ACR_LOGIN_SERVER }}/kolsherut-etl:production -n default
          kubectl set env deployment/kolsherut-etl CODE_VERSION=${{ needs.detect.outputs.version }} -n default
          kubectl rollout restart deployment/kolsherut-etl -n default
          kubectl rollout status deployment/kolsherut-etl -n default --timeout=3m

      - name: Deploy Retrieval to Production
        id: deploy_retrieval
        if: ${{ !cancelled() && steps.ctx.outcome == 'success' && needs.build-retrieval.result == 'success' }}
        run: |
          kubectl set image deployment/kolsherut-retrieval kolsherut-retrieval=${{ secrets.ACR_LOGIN_SERVER }}/kolsherut-retrieval:production -n default
          kubectl set env deployment/kolsherut-retrieval CODE_VERSION=${{ needs.detect.outputs.version }} -n default
          kubectl rollout restart deployment/kolsherut-retrieval -n default
          kubectl rollout status deployment/kolsherut-retrieval -n default --timeout=3m

      - name: Deploy FE to Production
        id: deploy_fe
        if: ${{ !cancelled() && steps.ctx.outcome == 'success' && needs.build-fe.result == 'success' }}
        run: |
          kubectl set image deployment/kolsherut-fe kolsherut-fe=${{ secrets.ACR_LOGIN_SERVER }}/kolsherut-fe:production -n default
          kubectl set env deployment/kolsherut-fe CODE_VERSION=${{ needs.detect.outputs.version }} -n default
          kubectl rollout restart deployment/kolsherut-fe -n default
          kubectl rollout status deployment/kolsherut-fe -n default --timeout=45m

      - name: Fail If Any Build Failed
        if: >
          !cancelled() &&
          (needs.build-fe.result == 'failure' ||
           needs.build-be.result == 'failure' ||
           needs.build-etl.result == 'failure' ||
           needs.build-retrieval.result == 'failure' ||
           needs.sync-etl-plugins.result == 'failure')
        run: |
          echo "At least one build or sync job failed"
          exit 1
