{{- if and .Values.frontend.ingress.enabled .Values.frontend.ingress.basicAuth.enabled -}}
{{- $username := required "frontend.ingress.basicAuth.username is required when basicAuth is enabled (set it in secrets-<env>.yaml)" .Values.frontend.ingress.basicAuth.username -}}
{{- $password := required "frontend.ingress.basicAuth.password is required when basicAuth is enabled (set it in secrets-<env>.yaml)" .Values.frontend.ingress.basicAuth.password -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "frontend.basicAuthSecretName" . }}
  labels:
    component: frontend
    {{- include "backend.labels" . | nindent 4 }}
type: Opaque
data:
  # ingress-nginx expects an htpasswd file under the key "auth".
  auth: {{ htpasswd $username $password | b64enc | quote }}
{{- end }}
